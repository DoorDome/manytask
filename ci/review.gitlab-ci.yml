.manytask-review:
  stage: .post
  image: curlimages/curl:8.10.1
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^submit\//'
      when: manual
  script:
    - |
      task="${CI_COMMIT_REF_NAME#submit/}"
      curl --fail-with-body --silent --show-error \
        --header "Authorization: Bearer ${TESTER_TOKEN}" \
        --data-urlencode "task=${task}" \
        --data-urlencode "username=${CI_PROJECT_NAME}" \
        --data-urlencode "reported_by=${GITLAB_USER_LOGIN}" \
        --data-urlencode "request_type=${REVIEW_ACTION}" \
        "${MANYTASK_URL%/}/api/report"

review-accept:
  extends: .manytask-review
  variables:
    REVIEW_ACTION: approve

review-changes-oral:
  extends: .manytask-review
  variables:
    REVIEW_ACTION: changes_oral

review-changes-written:
  extends: .manytask-review
  variables:
    REVIEW_ACTION: changes_written
