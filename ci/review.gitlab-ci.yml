.manytask-review:
  stage: .post
  image: curlimages/curl:8.10.1
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^submit\//'
      when: manual
      allow_failure: true
  script:
    - |
      curl --fail-with-body --silent --show-error \
        --header "Authorization: Bearer ${TESTER_TOKEN}" \
        --data-urlencode "task=${CI_COMMIT_REF_NAME#submit/}" \
        --data-urlencode "username=${CI_PROJECT_NAME}" \
        --data-urlencode "reported_by=${GITLAB_USER_LOGIN}" \
        --data-urlencode "request_type=${REVIEW_ACTION}" \
        "${MANYTASK_URL%/}/api/report"

accept:
  extends: .manytask-review
  variables:
    REVIEW_ACTION: accept

request_codereview:
  extends: .manytask-review
  variables:
    REVIEW_ACTION: request_codereview

request_oral:
  extends: .manytask-review
  variables:
    REVIEW_ACTION: request_oral
